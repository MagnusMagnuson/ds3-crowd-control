[package]
name = "ds3mod"
version = "0.1.0"
edition = "2021"
description = "Dark Souls III crowd-control mod"

[lib]
crate-type = ["cdylib"]
name = "ds3mod"

[dependencies]
darksouls3 = "0.14"
fromsoftware-shared = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
retour = "0.3"
pelite = "0.10"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }
